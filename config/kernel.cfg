MEMORY {
    #include "ram.inc"
    K_SIGNATURE:    start = $c000, size = $0003, fill=yes, fillval = $00;
    K_JMPTBL:       start = $c003, size = $0045, fill=yes, fillval = $00;
    CODE:           start = $c048, size = $3fb2, fill=yes, fillval = $aa;
    K_VECT:         start = $fffa, size = $06, fill=yes, fillval = $aa;
}
SEGMENTS {
    K_ZP:           load = K_ZP, type = zp;
    K_FETCH:        load = CODE, run = K_LRAM, type = ro, define = yes;
    K_JSRFAR:       load = CODE, run = K_LRAM, type = ro, define = yes;
    K_IRQ:          load = CODE, run = K_LRAM, type = ro, define = yes;
    K_LRAM:         load = K_LRAM, type = bss, define = yes;
    K_KEYMAP:       load = K_BRAM, type = bss, define = yes;
    K_BRAM:         load = K_BRAM, type = bss, define = yes;
    K_SIGNATURE:    load = K_SIGNATURE, type = ro, define = yes;
    CODE:           load = CODE, type = ro, define = yes;
    K_JMPTBL:       load = K_JMPTBL, type = ro, define = yes;
    K_VECT:         load = K_VECT, type = ro, define = yes;
}
